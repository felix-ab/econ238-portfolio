<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ page.title | default: site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="preload" href="{{ '/assets/fonts/Switzer-Regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script>try{var t=localStorage.getItem('portfolio-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <script src="{{ '/assets/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Felix Brener portfolio home"><span class="monogram" aria-hidden="true">fb.</span><span>Course portfolio</span></a>
      <button class="theme-control" type="button" hidden aria-label="Appearance: system. Activate to switch to light.">View: <span>Auto</span><span class="theme-dot" aria-hidden="true"></span></button>
    </header>
    <main id="main" class="{% if page.home %}home{% else %}assignment{% endif %}">
      {% unless page.home %}<a class="back-link" href="{{ '/' | relative_url }}#assignments">← All assignments</a>{% endunless %}
      {% if page.home %}{% include home.html %}{% else %}{{ content }}{% endif %}
    </main>
    <footer><a href="https://github.com/felix-ab/econ238-portfolio">Repository <span aria-hidden="true">↗</span></a></footer>
  </div>
</body>
</html>
